# Kitty - glass/tahoe inspired
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 12.5

# Visual style
background_opacity 0.82
background_blur 18
confirm_os_window_close 0
window_padding_width 10
hide_window_decorations no

# Colors (cool glass vibe)
foreground            #d6e3ff
background            #0f111acc
selection_foreground  #0f111a
selection_background  #9ec7ff
cursor                #b8d3ff
cursor_text_color     #0f111a

# Tahoe-like accents
active_border_color   #7aa2f7
inactive_border_color #2b3448
active_tab_background #7aa2f7
active_tab_foreground #0f111a
inactive_tab_background #1a2030
inactive_tab_foreground #8b9bb4

# Quality of life
enable_audio_bell no
shell_integration enabled
copy_on_select yes
