# Kitty — Glass / Tahoe style

############
# Font/UI
############
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13.0
disable_ligatures never

############
# Window look
############
background_opacity      0.80
background_blur         22
window_padding_width    12
hide_window_decorations no
confirm_os_window_close 0

# Slightly rounded feel via spacing + no hard borders
draw_minimal_borders yes
window_border_width 1pt
active_border_color   #89b4fa
inactive_border_color #2b3448

############
# Colors (cold glass palette)
############
foreground            #dbe7ff
background            #0b1020
selection_foreground  #0b1020
selection_background  #9cc5ff
cursor                #c6dcff
cursor_text_color     #0b1020

# ANSI
color0  #1e2233
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #cdd6f4
color8  #45475a
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #e6e9ef

############
# Tabs
############
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
active_tab_background   #89b4fa
active_tab_foreground   #0b1020
inactive_tab_background #1a2030
inactive_tab_foreground #8b9bb4

############
# Behavior
############
enable_audio_bell no
copy_on_select yes
shell_integration enabled
mouse_hide_wait 1.5
repaint_delay 8
input_delay 2

############
# Nice extras
############
url_color #8ec7ff
url_style curly

map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+shift+q close_tab
