general {
    gaps_in = 6
    gaps_out = 12
    border_size = 1
    col.active_border = rgba(89b4faff)
    col.inactive_border = rgba(313244ff)
    resize_on_border = false
    layout = dwindle
}

decoration {
    rounding = 10
    active_opacity = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 4
        passes = 1
        vibrancy = 0.15
    }
}

animations {
    enabled = yes
    animation = windows, 1, 4, default
    animation = fade, 1, 4, default
    animation = workspaces, 1, 3, default
}
