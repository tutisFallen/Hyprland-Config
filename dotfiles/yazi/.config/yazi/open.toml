[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" }
]

[open]
rules = [
  { mime = "text/*", use = "edit" },
  { name = "*.md", use = "edit" },
  { name = "*.txt", use = "edit" },
  { name = "*.toml", use = "edit" },
  { name = "*.lua", use = "edit" },
  { name = "*.conf", use = "edit" },
  { name = "*.json", use = "edit" },
  { name = "*.yaml", use = "edit" },
  { name = "*.yml", use = "edit" },
  { name = "*.sh", use = "edit" },
  { name = "*", use = "open" }
]
