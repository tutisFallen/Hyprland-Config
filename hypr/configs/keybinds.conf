# ################
# ## VARIABLES ###
# ################

$mod = SUPER
$terminal = /home/$USER/.config/hypr/scripts/terminal-launcher
#$loja = flatpak run io.github.kolunmi.Bazaar
$archive = nautilus
$browser = chromium
$editor = flatpak run dev.zed.Zed ~/.config/hypr # editor chamado ZED tem no flatpak


# #############################
# ## APPLICATION LAUNCHERS ###
# #############################

bind = $mod, RETURN, exec, $terminal
bind = $mod SHIFT, M, exec, $editor
bind = $mod, B, exec, $browser
bind = $mod, E, exec, $archive
$bind = $mod SHIFT, W, exec, $loja


#########################
### DMS SHELL BINDS ####
#########################

########## CORE ##########
# Launcher estilo Windows (Spotlight)
bind = SUPER, A, exec, dms ipc call spotlight toggle
# Clipboard manager
bind = SUPER, V, exec, dms ipc call clipboard toggle
# Notification Center
bind = SUPER, N, exec, dms ipc call notifications toggle
# Process Manager
bind = SUPER, M, exec, dms ipc call processlist toggle
# Control Center (rede, bluetooth, áudio, etc.)
bind = SUPER, comma, exec, dms ipc call control-center toggle
# Settings Modal
bind = SUPER, HOME, exec, dms ipc call settings toggle

########## AUDIO ##########
# Volume Up / Down / Mute
bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 5
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 5
bindl  = , XF86AudioMute,        exec, dms ipc call audio mute
# Microfone
bindl = SHIFT, XF86AudioMute, exec, dms ipc call audio micmute
# Controle de Mídia
bindel = , XF86AudioNext, exec, dms ipc call mpris next
bindel = , XF86AudioPrev, exec, dms ipc call mpris previous
bindel = , XF86AudioPlay, exec, dms ipc call mpris playPause

########## BRILHO ##########
bindel = , XF86MonBrightnessUp,   exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""
# Alternar modo exponencial (muito útil em monitores fortes)
bind = SUPER, F7, exec, dms ipc call brightness toggleExponential

########## WALLPAPER ##########
# Abrir DankDash (browser de wallpapers)
bind = SUPER, Y, exec, dms ipc call dankdash wallpaper
# Próximo wallpaper global
bind = SUPER ALT, SPACE, exec, dms ipc call wallpaper next

########## TEMA / APARÊNCIA ##########
# Alternar tema claro/escuro
bind = SUPER, F6, exec, dms ipc call theme toggle

########## NIGHT MODE ##########
# Ativar/desativar night mode
bind = SUPER, F5, exec, dms ipc call night toggle

########## LOCK SCREEN ##########
bind = SUPER, L, exec, dms ipc call lock lock

########## POWERMENU ##########
bind = SUPER, DELETE, exec, dms ipc call powermenu toggle

########## HYPR OVERVIEW ##########
# Overview dos workspaces (igual GNOME)
bind = SUPER, TAB, exec, dms ipc call hypr toggleOverview

########## DOCK ##########
bind = SUPER, D, exec, dms ipc call dock toggle

########## DASHBOARD ##########
# Modo overview do DMS
bind = SUPER, F4, exec, dms ipc call dash toggle ""

########## WIDGETS ##########
# Exemplo: abrir popout do relógio (se existir)
bind = SUPER, W, exec, dms ipc call widget toggle clock

########## SCREENSHOT (DMS + editor swappy/satty) ##########
bind = SUPER, Print, exec, dms ipc call niri screenshot
bind = SHIFT, Print, exec, dms ipc call niri screenshotScreen
bind = CTRL, Print, exec, dms ipc call niri screenshotWindow
























##################
### SECURITY ###
##################

bind = SUPER, L, exec, qs -c noctalia-shell ipc call lockScreen lock
bind = $mod SHIFT, Q, exit

#######################
### SYSTEM CONTROLS ###
#######################

bind = $mod SHIFT, C, exec, hyprctl reload

#######################
### AUDIO CONTROLS ###
#######################

bindel = , XF86AudioRaiseVolume, exec, dms ipc call audio increment 3
bindel = , XF86AudioLowerVolume, exec, dms ipc call audio decrement 3
bindl = , XF86AudioMute, exec, dms ipc call audio mute
bindl = SHIFT, XF86AudioMute, exec, dms ipc call audio micmute
bindel = , XF86AudioPrev, exec, dms ipc call mpris previous
bindel = , XF86AudioNext, exec, dms ipc call mpris next
bindel = , XF86AudioPlay, exec, dms ipc call mpris playPause

###########################
### BRIGHTNESS CONTROLS ###
###########################

bindel = , XF86MonBrightnessUp, exec, dms ipc call brightness increment 5 ""
bindel = , XF86MonBrightnessDown, exec, dms ipc call brightness decrement 5 ""

##########################
### WINDOW MANAGEMENT ###
##########################

bind = $mod, Q, killactive
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, SPACE, togglefloating
bind = $mod, P, pseudo
#bind = $mod, W, togglegroup
bind = $mod, T, togglesplit
bind = $mod, C, centerwindow

############################
### GROUP MANAGEMENT ###
############################

bind = $mod, G, changegroupactive, f
bind = $mod SHIFT, G, changegroupactive, b
bind = ALT, TAB, changegroupactive, f

##########################
### FOCUS NAVIGATION ###
##########################

bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

########################
### WINDOW MOVEMENT ###
########################

bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

######################
### SWAP WINDOWS ###
######################

bind = $mod ALT, H, swapwindow, l
bind = $mod ALT, J, swapwindow, d
bind = $mod ALT, K, swapwindow, u
bind = $mod ALT, L, swapwindow, r

###########################
### COLUMN NAVIGATION ###
###########################

bind = $mod, Home, focuswindow, first
bind = $mod, End, focuswindow, last

###########################
### MONITOR NAVIGATION ###
###########################

bind = $mod CTRL, left, focusmonitor, l
bind = $mod CTRL, right, focusmonitor, r
bind = $mod CTRL, up, focusmonitor, u
bind = $mod CTRL, down, focusmonitor, d

bind = $mod CTRL, H, focusmonitor, l
bind = $mod CTRL, J, focusmonitor, d
bind = $mod CTRL, K, focusmonitor, u
bind = $mod CTRL, L, focusmonitor, r

# Trocar entre monitores rapidamente
bind = $mod ALT, 1, focusmonitor, DP-1
bind = $mod ALT, 2, focusmonitor, HDMI-A-2

########################
### MOVE TO MONITOR ###
########################

bind = $mod SHIFT CTRL, left, movewindow, mon:l
bind = $mod SHIFT CTRL, down, movewindow, mon:d
bind = $mod SHIFT CTRL, up, movewindow, mon:u
bind = $mod SHIFT CTRL, right, movewindow, mon:r

bind = $mod SHIFT CTRL, H, movewindow, mon:l
bind = $mod SHIFT CTRL, J, movewindow, mon:d
bind = $mod SHIFT CTRL, K, movewindow, mon:u
bind = $mod SHIFT CTRL, L, movewindow, mon:r

#############################
### WORKSPACE NAVIGATION ###
#############################

bind = $mod, Page_Down, workspace, e+1
bind = $mod, Page_Up, workspace, e-1
bind = $mod, U, workspace, e+1
bind = $mod, I, workspace, e-1

#############################
### MOUSE WHEEL NAVIGATION ###
#############################

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

#############################
### NUMBERED WORKSPACES ###
#############################

# Workspace 1 sempre no DP-1 (monitor vertical)
# Workspaces 2-9 no HDMI-A-2 (monitor principal)
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

####################################
### MOVE TO NUMBERED WORKSPACES ###
####################################

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

###########################################
### MOVE TO WORKSPACE SILENTLY (SEM SEGUIR) ###
###########################################

bind = $mod CTRL, 1, movetoworkspacesilent, 1
bind = $mod CTRL, 2, movetoworkspacesilent, 2
bind = $mod CTRL, 3, movetoworkspacesilent, 3
bind = $mod CTRL, 4, movetoworkspacesilent, 4
bind = $mod CTRL, 5, movetoworkspacesilent, 5
bind = $mod CTRL, 6, movetoworkspacesilent, 6
bind = $mod CTRL, 7, movetoworkspacesilent, 7
bind = $mod CTRL, 8, movetoworkspacesilent, 8
bind = $mod CTRL, 9, movetoworkspacesilent, 9
bind = $mod CTRL, 0, movetoworkspacesilent, 10

####################################
### SPECIAL WORKSPACE (SCRATCHPAD) ###
####################################

bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

###########################
### LAYOUT MANAGEMENT ###
###########################

bind = $mod, bracketleft, layoutmsg, preselect l
bind = $mod, bracketright, layoutmsg, preselect r
bind = $mod, R, layoutmsg, togglesplit

##########################
### WINDOW RESIZING ###
##########################

bind = $mod CTRL, F, resizeactive, exact 100%

# Manual Sizing
binde = $mod, minus, resizeactive, -50 0
binde = $mod, equal, resizeactive, 50 0
binde = $mod SHIFT, minus, resizeactive, 0 -50
binde = $mod SHIFT, equal, resizeactive, 0 50


########################
### MOUSE BINDINGS ###
########################

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

#####################
### SCREENSHOTS ###
#####################

# Print = Area selecionada
bind = , Print, exec, grimblast copysave area ~/Imagens/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Shift+Print = Tela inteira
bind = SHIFT, Print, exec, grimblast copysave screen ~/Imagens/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Super+Print = Janela ativa
bind = $mod, Print, exec, grimblast copysave active ~/Imagens/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png

# Ctrl+Print = Copiar área (sem salvar)
bind = CTRL, Print, exec, grimblast copy area

###########################
### SCREEN RECORDING ###
###########################

bind = $mod SHIFT, R, exec, ~/.config/hypr/scripts/record.sh start
bind = $mod SHIFT, P, exec, ~/.config/hypr/scripts/record.sh pause
bind = $mod SHIFT, S, exec, ~/.config/hypr/scripts/record.sh stop
