## Customization
misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
    vfr = true  # economiza bateria/recursos
    vrr = 0  # Variable Refresh Rate (mude para 1 se tiver monitor com VRR/FreeSync)
    mouse_move_enables_dpms = true  # acorda o monitor ao mover mouse
    key_press_enables_dpms = true  # acorda o monitor ao pressionar tecla
}

cursor {
    no_hardware_cursors = true
    no_warps = false  # cursor não "pula" entre monitores
    default_monitor = HDMI-A-2 # deixe vazio ou especifique um monitor
}

general {
    gaps_in = 3
    gaps_out = 8
    border_size = 0
    col.inactive_border = rgba(595959aa)
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg  # borda gradiente (opcional)
    resize_on_border = true  # ÚTIL: redimensionar janela clicando na borda
    allow_tearing = false  # mude para true se jogar competitivo (reduz input lag)
    layout = dwindle
}

decoration {
    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }
    
    rounding = 10

    # Opacidade
    inactive_opacity = 1.0
    active_opacity = 1.0
    fullscreen_opacity = 1.0

    blur {
        enabled = true
        size = 8
        passes = 2  # 4 passes = bom equilíbrio (mais = mais pesado)
        vibrancy = 0.1696
        new_optimizations = true  # melhor performance
        xray = false  # blur não afeta janelas transparentes
        ignore_opacity = true
    }

    # Dimming (escurecer janelas inativas - opcional)
    dim_inactive = false
    dim_strength = 0.1  # 0.0 - 1.0
}

animations {
    enabled = true

    # Bezier curves
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    bezier = easeOutCubic, 0.33, 1, 0.68, 1  # animação suave alternativa

    # Animações
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = windowsMove, 1, 5, default  # movimento de janelas
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = fadeIn, 1, 5, default  # fade in específico
    animation = fadeOut, 1, 5, default  # fade out específico
    animation = workspaces, 1, 6, default
    animation = specialWorkspace, 1, 6, default, slidevert  # workspace especial
}

# Layouts
dwindle {
    pseudotile = true  # janelas flutuantes comportam melhor
    preserve_split = true
    force_split = 0  # 0 = automático, 1 = split left/top, 2 = split right/bottom
}

master {
    new_status = master
    new_on_top = false  # novas janelas vão para o topo
    mfact = 0.5  # proporção da janela master (0.5 = 50%)
}
