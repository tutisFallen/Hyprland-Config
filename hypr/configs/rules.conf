###################################
### GAMING OPTIMIZATIONS (AMD) ###
###################################

# Vulkan
env = AMD_VULKAN_ICD,RADV
env = RADV_PERFTEST,gpl
env = RADV_DEBUG,hang

# Video aceleração
env = LIBVA_DRIVER_NAME,radeonsi
env = VDPAU_DRIVER,radeonsi

# Mesa driver override
env = MESA_LOADER_DRIVER_OVERRIDE,radeonsi
env = __GLX_VENDOR_LIBRARY_NAME,mesa

# Destravar performance
env = mesa_glthread,true
env = vblank_mode,0


###################################
### DANKMATERIALSHELL MACOS BLUR ###
###################################

#############
# Bar / Dock
#############
blurls = class:^(dms)$
blurls = gtk-layer-shell
windowrulev2 = opacity 0.90, class:^(dms)$
windowrulev2 = rounding 20, class:^(dms)$
layerrule = blur, ^(dms:bar)$
layerrule = ignorealpha 0.25, ^(dms:bar)$
layerrule = ignorezero, ^(dms:bar)$
layerrule = xray 0, ^(dms:bar)$

windowrulev2 = rounding 30, class:^(dms)$
windowrulev2 = nofocus, class:^(dms)$
windowrulev2 = noanim, class:^(dms)$
windowrulev2 = noshadow, class:^(dms)$
windowrulev2 = float, class:^(dms)$


########################
# Control Center (macOS)
########################
layerrule = blur, ^(dms:controlcenter)$
layerrule = ignorealpha 0.20, ^(dms:controlcenter)$
layerrule = ignorezero, ^(dms:controlcenter)$
layerrule = xray 0, ^(dms:controlcenter)$


############
# Spotlight
############
layerrule = blur, ^(dms:spotlight)$
layerrule = ignorealpha 0.18, ^(dms:spotlight)$
layerrule = ignorezero, ^(dms:spotlight)$


#######################
# Notifications Sidebar
#######################
layerrule = blur, ^(dms:notifications)$
layerrule = ignorealpha 0.25, ^(dms:notifications)$
layerrule = ignorezero, ^(dms:notifications)$


###########
# OSD (HUD)
###########
layerrule = blur, ^(dms:osd)$
layerrule = ignorealpha 0.22, ^(dms:osd)$
layerrule = ignorezero, ^(dms:osd)$


#############
# Dashboard
#############
layerrule = blur, ^(dms:dash)$
layerrule = ignorealpha 0.20, ^(dms:dash)$
layerrule = ignorezero, ^(dms:dash)$
layerrule = xray 0, ^(dms:dash)$


##################
# Settings Window
##################
layerrule = blur, ^(dms:settings)$
layerrule = ignorealpha 0.18, ^(dms:settings)$
layerrule = ignorezero, ^(dms:settings)$


###########
# Widgets
###########
layerrule = blur, ^(dms:widget)$
layerrule = ignorealpha 0.22, ^(dms:widget)$
layerrule = ignorezero, ^(dms:widget)$
