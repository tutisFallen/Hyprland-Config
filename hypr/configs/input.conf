## Input
input {
    kb_layout = us
    kb_variant = intl
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1
    sensitivity = 0  # -1.0 - 1.0, 0 means no modification
    float_switch_override_focus = 2  # Melhor para janelas flutuantes

    # === Touchpad (se você tiver laptop) ===
    touchpad {
        natural_scroll = true
        tap-to-click = true
        tap-and-drag = true
        drag_lock = false
        disable_while_typing = true
        middle_button_emulation = true  # Útil para copiar/colar
        clickfinger_behavior = true  # Click com 2/3 dedos
        scroll_factor = 1.0
    }

    # === Outras opções úteis ===
    accel_profile = adaptive  # "flat" para gaming preciso, "adaptive" para uso geral
    force_no_accel = false
    scroll_method = 2fg  # Scroll com 2 dedos
    scroll_button = 0  # 0 = desabilitado, ou botão do mouse
    numlock_by_default = true
    repeat_rate = 50
    repeat_delay = 300

    # === Para gaming ===
    left_handed = false
    scroll_points =   # Deixe vazio para padrão
}

# === Mouse específico ===
device {
    name = epic-mouse-v1
    sensitivity = -0.5
    accel_profile = adaptive  # Mude para "flat" se preferir sem aceleração
}
