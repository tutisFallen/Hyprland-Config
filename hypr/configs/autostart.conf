#################
### AUTOSTART ###
#################

# === Importar variáveis para sessão ===
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_DATA_DIRS PATH
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_DATA_DIRS PATH QT_QPA_PLATFORM QT_QPA_PLATFORMTHEME

# === Applets e Serviços ===
exec-once = nm-applet &
exec-once = hyprpaper &

# === Polkit (autenticação) ===
#exec-once = systemctl --user start hyprpolkitagent
#exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1 &

# === Scripts e Utilitários ===
#exec-once = ~/.config/hypr/scripts/dircreate.sh
exec-once = wl-paste --watch cliphist store

# === Shell do Sistema DankMaterialShell===
exec-once = dms run

# === Shell do Sistema Caelestia-shell===
#exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP && sleep 2 && qs -c caelestia

# === Shell do Sistema Noctalia-shell===
#exec-once = qs -c noctalia-shell

# === Regras de Monitor ===
exec-once = hyprctl dispatch workspace 1 DP-1
exec-once = hyprctl dispatch workspace 2 HDMI-A-2

# Atualizar ícones ao iniciar
exec-once = ~/.config/hypr/scripts/update-icons.sh

#controle de ventoinha da rx580
exec-once = corectrl --minimize-systray
exec-once = ~/.config/hypr/scripts/gpu-fan-control.sh &
